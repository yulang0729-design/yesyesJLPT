/* Listening PDF-original mode */
.listen-pdf-wrap{display:flex;flex-direction:column;gap:14px}
.listen-pdf-intro{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:16px;padding:14px 16px;color:#065f46;font-size:13px;line-height:1.75}
.listen-pdf-page{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;align-items:start}
.listen-pdf-paper{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:8px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.listen-pdf-paper img{display:block;width:100%;height:auto;border-radius:9px}
.listen-pdf-side{position:sticky;top:82px;background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.listen-pdf-side-title{font-size:12px;font-weight:800;color:#334155;margin-bottom:9px}
.listen-q{border:1px solid #e2e8f0;border-radius:11px;padding:9px;margin:7px 0;background:#fff}
.listen-q-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
.listen-q-num{font-weight:800;font-size:12px;color:#334155}
.listen-q-local{font-size:10px;color:#94a3b8}
.listen-q-opts{display:grid;grid-template-columns:repeat(var(--option-count,4),1fr);gap:5px}
.listen-q-opts button{border:1px solid #dbe1e8;background:#f8fafc;border-radius:7px;padding:7px 0;font-size:12px;color:#475569}
.listen-q-opts button:hover{background:#f1f5f9}
.listen-q-opts button.selected{background:#111827;color:#fff;border-color:#111827}
.listen-q-opts button.correct{background:#ecfdf5;color:#047857;border-color:#34d399}
.listen-q-opts button.wrong{background:#fff1f2;color:#be123c;border-color:#fb7185}
.listen-pdf-note{font-size:11px;color:#64748b;margin-top:9px;line-height:1.55}
@media(max-width:900px){.listen-pdf-page{grid-template-columns:1fr}.listen-pdf-side{position:relative;top:auto}.listen-q-opts{grid-template-columns:repeat(var(--option-count,4),1fr)}}
</style>

        { id: 20, section: "問題3 文脈規定", text: "虫歯を防ぐためには、食後に歯を磨くことが最も(　)だと思う。", options: ["自動的", "効果的", "人工的", "消極的"], correct: 2, analysis: "防蛀牙最行之有效的方法是饭后刷牙，用「効果的（こうかてき）」。" },
        { id: 21, section: "問題3 文脈規定", text: "林さんと森さんは、(　) 顔は知っているが、話したことはないそうだ。", options: ["たまに", "ついでに", "おたがいに", "おもに"], correct: 3, analysis: "互相知道对方的长相，用「お互いに（おたがいに）」。" },
        { id: 22, section: "問題3 文脈規定", text: "前の人の発表が終わったので、次は私が発表する(　)だ。", options: ["線", "運", "段", "番"], correct: 4, analysis: "轮到某人的轮次/次序，用「番（ばん）」。" },
        { id: 23, section: "問題3 文脈規定", text: "この飛行機に載せることができる荷物は、一人20キロ以内に(　)されている。", options: ["制限", "禁止", "検査", "解決"], correct: 1, analysis: "行李被限制在每人20公斤以内，用「制限（せいげん）」。" },
        { id: 24, section: "問題3 文脈規定", text: "砂糖か塩か分からなかったので、箸で(　)みた。", options: ["かじって", "なめて", "かんで", "まぜて"], correct: 2, analysis: "分不清用筷子蘸着舔/尝一下，用「舐める（なめる）」。" },
        { id: 25, section: "問題3 文脈規定", text: "少し熱があって、体も(　)ので、今日は仕事を休もうと思う。", options: ["だるい", "まぶしい", "ぬるい", "にがい"], correct: 1, analysis: "发烧时身体发沉乏力无精打采，用「だるい」。" },

        { id: 26, section: "問題4 言い換え類義語", text: "皆さん、<ins class='font-bold underline decoration-indigo-500 underline-offset-4'>避難してください</ins>。", options: ["ならんで", "入って", "にげて", "急いで"], correct: 3, analysis: "避難する（避难逃跑）＝ 逃げる（にげる）。" },
        { id: 27, section: "問題4 言い換え類義語", text: "何かいい<ins class='font-bold underline decoration-indigo-500 underline-offset-4'>案</ins>はありませんか。", options: ["ルール", "アイデア", "メニュー", "サービス"], correct: 2, analysis: "案（主意、构思）＝ アイデア (idea)。" },
        { id: 28, section: "問題4 言い換え類義語", text: "私が何を言っても、彼はずっと<ins class='font-bold underline decoration-indigo-500 underline-offset-4'>だまっていた</ins>。", options: ["話さなかった", "笑わなかった", "動かなかった", "怒らなかった"], correct: 1, analysis: "黙る（沉默不语）＝ 話さなかった。" },
        { id: 29, section: "問題4 言い換え類義語", text: "このやり方が<ins class='font-bold underline decoration-indigo-500 underline-offset-4'>ベスト</ins>だ。", options: ["最もよい", "最もよくない", "最も難しい", "最も難しくない"], correct: 1, analysis: "ベスト (Best) ＝ 最もよい。" },
        { id: 30, section: "問題4 言い換え類義語", text: "お店の人が<ins class='font-bold underline decoration-indigo-500 underline-offset-4'>配達して</ins>くれた。", options: ["組み立てて", "手伝って", "貸して", "届けて"], correct: 4, analysis: "配達する（送货上门）＝ 届けてくれた。" },

        { id: 31, section: "問題5 語彙の正しい用法", text: "「<ins class='font-bold text-indigo-600'>診察</ins>」の正しい使い方はどれか。", options: ["警察は事件があった場所を注意深く診察した。", "中学時代に星の動きを診察して記録をつけていた。", "担任の先生は生徒から相談を受け、丁寧に診察した。", "母は医者で、毎日たくさんの患者を診察している。"], correct: 4, analysis: "「診察」专指医生给患者看病诊察。选项4正确。" },
        { id: 32, section: "問題5 語彙の正しい用法", text: "「<ins class='font-bold text-indigo-600'>行き先</ins>」の正しい使い方はどれか。", options: ["教師になるという行き先のために、毎日頑張っている。", "実験の行き先が、思っていたことと違ってびっくりした。", "次の旅行の行き先を、今夜家族で話し合うつもりだ。", "この映画は見たことがあるので、内容の行き先は知っている。"], correct: 3, analysis: "「行き先」指路途目的地、行踪方向。商量旅行的目的地正确。" },
        { id: 33, section: "問題5 語彙の正しい用法", text: "「<ins class='font-bold text-indigo-600'>取り消す</ins>」の正しい使い方はどれか。", options: ["床に落ちている大きなごみを取り消してから、掃除機を使った。", "サッカーの後、シャワーを浴びて汗を取り消した。", "このパンはかびが生えているので、もう取り消したほうがいい。", "都合が悪くなったので、レストランの予約を取り消した。"], correct: 4, analysis: "「取り消す」意为取消撤回已定计划/预定。取消餐厅预订正确。" },
        { id: 34, section: "問題5 語彙の正しい用法", text: "「<ins class='font-bold text-indigo-600'>共通</ins>」の正しい使い方はどれか。", options: ["父は休みの日も、いつもと共通の時間に寝ることが多い。", "娘と息子は、共通の趣味を持っていて、とても仲がいい。", "私と姉は、周りの人から共通の顔だとよく言われる。", "あしたも今日と共通の気温で、暖かいそうだ。"], correct: 2, analysis: "「共通」表示两者或多者共同拥有（如共通の趣味、共通点）。" },
        { id: 35, section: "問題5 語彙の正しい用法", text: "「<ins class='font-bold text-indigo-600'>詰める</ins>」の正しい使い方はどれか。", options: ["旅行に持っていく物をスーツケースに詰めておきます。", "味が薄かったので、スープに塩とこしょうを詰めました。", "お客さんのコップに水を詰めてください。", "時々窓を開けて、部屋の中に新鮮な空気を詰めた。"], correct: 1, analysis: "「詰める」指将物品塞入容器或空间。把行李物品装进箱子里正确。" }

      // 2. 言語知識（文法・読解）38题
      grammar: [
        { id: 1, section: "問題1 文法形式の判断", text: "この辺りは古いお寺や神社が多く、外国(　) 観光客にも人気がある。", options: ["で", "での", "から", "からの"], correct: 4, analysis: "修饰后面的名词「観光客」，表示“来自外国的游客”，用「外国からの観光客」。" },
        { id: 2, section: "問題1 文法形式の判断", text: "10年前に友人と2人で会社を作った。10年間で会社は少しずつ大きくなり、社員の数は100人(　)増えた。", options: ["までが", "までで", "にまで", "のまで"], correct: 3, analysis: "表示发展或累积达到了相当程度的规模时，使用「〜にまで（甚至达到/增加到了……）」。" },
        { id: 3, section: "問題1 文法形式の判断", text: "弁当屋で働いている友人が、よく売れる弁当は天気(　)違うと言っていた。", options: ["について", "によって", "において", "に比べて"], correct: 2, analysis: "「〜によって違う」表示“因……而有所不同”。" },
        { id: 4, section: "問題1 文法形式の判断", text: "中学生のころから留学したいと思っていた日本に、(　) 留学できることになった。", options: ["どうか", "決して", "ついに", "今にも"], correct: 3, analysis: "「ついに（终于）」配合长时间的愿望达成。" },
        { id: 5, section: "問題1 文法形式の判断", text: "虫歯は、ひどくなってからだと治すのに時間がかかる。ひどくならない(　) 歯医者に診てもらうことが重要だ。", options: ["うちに", "ときに", "までに", "たびに"], correct: 1, analysis: "「〜ないうちに」表示“趁着还没……的时候”。" },
        { id: 6, section: "問題1 文法形式の判断", text: "来月から大学の近くで一人暮らしを始める。通学のしやすさを(　)、大学まで歩いて通える所にした。", options: ["考えるように", "考えて", "考えたのに", "考えるのか"], correct: 2, analysis: "「〜を考えて」表示考虑到某项因素并采取相应行动。" },
        { id: 7, section: "問題1 文法形式の判断", text: "実家からみかんがたくさん送られてきた。一人では全部(　)と思ったので、友達に半分あげた。", options: ["食べられそうにない", "食べられなくなる", "食べられるだろう", "食べられたほうがいい"], correct: 1, analysis: "「食べられそうにない」可能态的推量否定，“看来一个人吃不完”。" },
        { id: 8, section: "問題1 文法形式の判断", text: "動物が好きな2歳の娘を(　)、先週初めて動物園に連れていった。", options: ["喜んだら", "喜びたくて", "喜ばせたら", "喜ばせたくて"], correct: 4, analysis: "使役形式表达愿望：「喜ばせる（让女儿开心）＋ たい（想）」。" },
        { id: 9, section: "問題1 文法形式の判断", text: "最近、バレエを習い始めた。上手に(　) 何年かかるかわからないが、頑張りたい。", options: ["踊れるようにすると", "踊れるようになっても", "踊れるようにして", "踊れるようになるのに"], correct: 4, analysis: "「〜のに時間・費用がかかる」表示在达成某个状态上需要花费。" },
        { id: 10, section: "問題1 文法形式の判断", text: "うちの犬は散歩が大好きだが、雨の日はぬれるのが嫌なようで、散歩に(　)。", options: ["行かなくてはいけない", "行きたがらない", "行ってもかまわない", "行くに違いない"], correct: 2, analysis: "描述第三者不想做某事使用「〜たがらない」。" },
        { id: 11, section: "問題1 文法形式の判断", text: "(デパートで)\n客「すみません、服の売り場は何階ですか。」\n店員「5階(　)。」", options: ["がございます", "がいらっしゃいます", "でございます", "でいらっしゃいます"], correct: 3, analysis: "服务人员向顾客礼貌介绍事物与位置，「〜でございます」＝「です」。" },
        { id: 12, section: "問題1 文法形式の判断", text: "(家で)\nA「夕飯に使う卵が足りないから、ちょっとスーパーまで(　)ね。」\nB「うん、わかった。」", options: ["買ってきておく", "買いにきている", "買いにいってくる", "買っていってしまう"], correct: 3, analysis: "去超市买然后回到家中，用「〜てくる」系列：「買いに行ってくる」。" },
        { id: 13, section: "問題1 文法形式の判断", text: "(電話で)\n田中「もしもし、田中です。山下さん、今ちょっといいですか。」\n山下「あ、田中さん。私も今ちょうど田中さんに電話をしようと(　)。」", options: ["思っていたところでした", "思っているところです", "思っていたからでした", "思っているからです"], correct: 1, analysis: "「〜ようと思っていたところでした」表示“我刚才正准备……”。" },

        { id: 14, section: "問題2 文の組み立て", text: "私は歌手の石川あかりが大好きだ。彼女 __ __ <ins class='text-indigo-600 font-bold'>★</ins> __ いないと思う。<br><span class='text-xs text-slate-500'>[1: 声がきれいな / 2: は / 3: 歌手 / 4: ほど]</span>", options: ["声がきれいな", "は", "歌手", "ほど"], correct: 3, analysis: "完整语序：彼女【2 は】彼女【4 ほど】【1 声がきれいな】【3 ★ 歌手】はいない。★处应选 3（歌手）。" },
        { id: 15, section: "問題2 文の組み立て", text: "最近は野菜や魚などの食料品も __ __ <ins class='text-indigo-600 font-bold'>★</ins> __ ニュースで知った。<br><span class='text-xs text-slate-500'>[1: 人が / 2: 増えてきている / 3: インターネットで買う / 4: ということを]</span>", options: ["人が", "増えてきている", "インターネットで買う", "ということを"], correct: 2, analysis: "完整语序：【3 インターネットで買う】【1 人が】【2 ★ 増えてきている】【4 ということを】ニュースで知った。★处应选 2。" },
        { id: 16, section: "問題2 文の組み立て", text: "(大学で) 中山「林先輩、ゼミの発表で使う資料を作ったんですが、 __ __ <ins class='text-indigo-600 font-bold'>★</ins> __ でしょうか。」 林「いいですよ。」<br><span class='text-xs text-slate-500'>[1: もらえない / 2: ところがあるので / 3: 一度チェックして / 4: 自信がない]</span>", options: ["もらえない", "ところがあるので", "一度チェックして", "自信がない"], correct: 3, analysis: "完整语序：【4 自信がない】【2 ところがあるので】【3 ★ 一度チェックして】【1 もらえない】でしょうか。★处选 3。" },
        { id: 17, section: "問題2 文の組み立て", text: "今朝は急いでいたから、 __ __ <ins class='text-indigo-600 font-bold'>★</ins> __ しまった。<br><span class='text-xs text-slate-500'>[1: 玄関の電気を消すのを / 2: きて / 3: 家を出て / 4: 忘れて]</span>", options: ["玄関の電気を消すのを", "きて", "家を出て", "忘れて"], correct: 2, analysis: "完整语序：【1 玄関の電気を消すのを】【4 忘れて】【3 家を出て】【2 ★ きて】しまった。★处选 2。" },
        { id: 18, section: "問題2 文の組み立て", text: "読書が趣味の友人は、いつどんな本を読んだかを __ __ <ins class='text-indigo-600 font-bold'>★</ins> __ そうだ。<br><span class='text-xs text-slate-500'>[1: 必ずノートに記録する / 2: 忘れない / 3: ように / 4: ことにしている]</span>", options: ["必ずノートに記録する", "忘れない", "ように", "ことにしている"], correct: 1, analysis: "完整语序：【2 忘れない】【3 ように】【1 ★ 必ずノートに記録する】【4 ことにしている】そうだ。★处选 1。" },

        { id: 19, section: "問題3 文章の文法", passageTitle: "ガソリンスタンドのサービス", passage: "先週、友達の車でドライブに行ったとき、私は初めて日本のガソリンスタンドに行きました。<br>ガソリンスタンドで友達が車を止めると、店員が車の窓のそばまで来ました。友達は窓を開けて、入れたいガソリンの種類と量を店員に伝えました。私は自分でガソリンを入れる店 ( 19 ) 知りませんでした。だから、その様子を見て、どうして友達は車から出ないんだろうと思いました。友達が窓を閉めると、すぐに店員がガソリンを入れ始めたので、驚きました。( 20 )、別の店員が来て、車の窓も丁寧に拭いてくれたのです。そのガソリンスタンドで友達は、一度も車から出ませんでした。<br>友達によると、日本のガソリンスタンドには、客が自分でガソリンを入れるところと店員が入れるところがあり、料金はそんなに変わらないそうです。私たちが ( 21 ) ガソリンスタンドでは、ガソリンを入れた車が道路に出るとき、店員が左右を見て車が来ないか確認して、見送りもしていました。<br>ガソリンを入れたり、窓を拭いたり、見送りをしたりしてもらって、私はそのガソリンスタンドが客や車を大切にしていると感じました。とても ( 22 )。", text: "( 19 ) に入る最もよいものを選びなさい。", options: ["は", "も", "だけ", "しか"], correct: 4, analysis: "与后文否定「知りませんでした」呼应，构成「〜しか…ない」（只知道…）。" },
        { id: 20, section: "問題3 文章の文法", text: "( 20 ) に入る最もよいものを選びなさい。", options: ["ただ", "例えば", "そのうえ", "ところが"], correct: 3, analysis: "店员不仅加油，而且还帮忙擦车窗，前后属于递进，用「そのうえ（不仅如此，而且）」。" },
        { id: 21, section: "問題3 文章の文法", text: "( 21 ) に入る最もよいものを選びなさい。", options: ["行った", "行ける", "行くような", "行きたかった"], correct: 1, analysis: "修饰已去过的那家加油站，定语用过去式「私たちが【行った】ガソリンスタンド」。" },
        { id: 22, section: "問題3 文章の文法", text: "( 22 ) に入る最もよいものを選びなさい。", options: ["いいサービスだろうと思うからです", "いいサービスだと思いました", "いいサービスにするつもりです", "いいサービスにしようとしました"], correct: 2, analysis: "表达自己的感想“我觉得这是非常棒的服务”，选「いいサービスだと思いました」。" },

        { id: 23, section: "問題4 短文読解 (1)", passage: "<strong>東王映画館インターネットチケット予約サービス</strong><br>村田新一樣<br>チケット代金を支払っていただき、ありがとうございました。<br>&lt;予約番号&gt; 0832 &lt;電話番号&gt; 090-0911-4215<br>&lt;日時&gt; 4月11日(土)14時〜<br>&lt;合計代金&gt; 大人2枚 3,600円<br>&lt;映画名&gt; 『海』<br>&lt;席番号&gt; K13 K14<br>・ご予約はキャンセルできませんので、ご注意ください。<br>・当日は、映画館でチケットを発券していただく必要がございます。券売機に&lt;予約番号&gt;と&lt;電話番号&gt;をご入力ください。<br>・映画開始から15分を過ぎますと、券売機での発券はできなくなります。それ以降は、チケットオフィスで発券いたします。", text: "当日、予約したチケットを券売機で発券したい場合、どうしなければならないか。", options: ["映画開始時間の15分前までに、券売機に必要な情報を入力する。", "映画開始時間の15分前までに、券売機でお金を払う。", "映画開始時間の15分後までに、券売機に必要な情報を入力する。", "映画開始時間の15分後までに、券売機でお金を払う。"], correct: 3, analysis: "邮件注明「映画開始から15分を過ぎますと、券売機での発券はできなくなります」，说明开场后15分钟之内需要在机器输入信息取票。" },
        { id: 24, section: "問題4 短文読解 (2)", passage: "アリサさん<br>大学の事務所に今日中に出さなければならない書類があるのを忘れていたので、ちょっと行ってきます。<br>カレーとスープはできたんだけど、サラダがまだできていないので、お願いできますか。冷蔵庫にトマトやレタスがあるから、適当に使ってください。<br>今日は私が晩ご飯を作ると言ったのに、ごめんなさい。帰りに何か甘いものを買ってきますね。<br class='text-right'>春美", text: "アリサさんがこのメモで頼まれていることは何か。", options: ["大学の事務所に行って、書類を出すこと", "カレーとスープを作ること", "サラダを作ること", "甘いものを買うこと"], correct: 3, analysis: "纸条明确拜托「サラダがまだできていないので、お願いできますか（沙拉还没做，能拜托你做吗）」。" },
        { id: 25, section: "問題4 短文読解 (3)", passage: "雑誌で「友達や家族と待ち合わせるとき、その場所に行く時間」についての調査の記事を読んだ。早めに行く人は、全体の59%で最も多く、次に多かったのが、時間に間に合うように行く人で36%だった。一方で、多少遅れても気にしないという人は、3%しかいなかった。<br>私はいつも早めに行くが、友人たちはたいてい遅れて来る。私が珍しいタイプなのかと思っていたが、この結果から、そうではないとわかって、意外だった。", text: "意外だったとあるが、調査結果のどのような点からそう思ったか。", options: ["「私」と同じタイプの人が、最も多い点", "「私」と同じタイプの人が、二番目に多い点", "「私」と同じタイプの人が、最も少ない点", "「私」と反対のタイプの人が、最も多い点"], correct: 1, analysis: "作者自己是提前到场型（早めに行く），原本以为自己是少数，结果发现与自己同类型的人在调查中是最多的（59%），因此感到意外。" },
        { id: 26, section: "問題4 短文読解 (4)", passage: "納豆は、体にいいし、おいしいので、私は毎日食べている。そのまま食べる人も多いが、私は卵に混ぜて焼いたり、みそ汁に入れたり、いろいろな料理に使っている。<br>しかし、今朝テレビを見て驚いた。納豆には、ほかの食べ物にはない種類の酵素が入っている。これには血液の流れをよくする効果があるが、50度以上の熱で減ってしまうそうなのだ。そうだとすると、私は今まで、とてももったいない食べ方をしていたことになる。", text: "もったいない食べ方をしていたとあるが、なぜもったいないと思ったのか。", options: ["体へのよい効果が弱くなってしまう料理のしかたで、納豆を食べていたから", "体へのよい効果が消えるような、たくさんの量の納豆を食べていたから", "おいしさがわからなくなるような料理のしかたで、納豆を食べていたから", "おいしくなる料理方法があるのに、それを知らないで納豆を食べていたから"], correct: 1, analysis: "文中提到纳豆酵素在50度以上加热会减少，而作者经常拿来煎蛋或煮热味增汤，使得对身体好的功效减弱了。" },

        { id: 27, section: "問題5 中文読解 (1)", passageTitle: "大学の漫画の授業", passage: "私の留学している日本の大学には、漫画を読んで社会について考える授業があります。私は子供のころから日本の漫画が大好きだったので、この授業を取りました。しかし、これは失敗でした。<br>この授業では、学生は毎週の授業の前に、先生が指定した漫画を読んでいくことになっていました。ところが、扱う漫画はどれも私が知らないものばかりだったので、読むのに時間がかかって、毎回とても大変でした。<br>いちばん困ったのは学期末の試験です。試験の前に、ある漫画を読んでおくように先生に言われました。その漫画は全部で3巻もあり、しっかり読むのにはとても時間がかかりました。そのために、ほかの試験の勉強ができなくなり、寝る時間も削らなければならなくなりました。いつもなら、試験期間中は漫画を読むのを我慢するのですが、このときの私は逆だったのです。<br>試験はうまくいきましたが、今はしばらく漫画はお休みにしたい気分です。", text: "毎回の授業の前に、学生がしなければならなかったことは何か。", options: ["授業で先生に扱ってもらいたい漫画を見つけてくること", "社会問題がテーマになっている漫画を見つけてくること", "先生に読んでくるように言われた漫画を読んでおくこと", "自分が読んだことがない漫画を探して、読んでおくこと。"], correct: 3, analysis: "对应第2段「先生が指定した漫画を読んでいくことになっていました」。" },
        { id: 28, section: "問題5 中文読解 (1)", text: "このときの私は、どのような状態だったか。", options: ["ほかの試験の勉強がしたいのに、漫画を読まなければならなかった。", "漫画が読みたいのに、試験の勉強をしなければならなかった。", "好きな漫画が読みたいのに、好きではない漫画を読まなければならなかった。", "試験の勉強をしなければならないのに、漫画を読むのを我慢できなかった。"], correct: 1, analysis: "原本考试期间要忍住不看漫画来复习，现在却必须花大量时间去读3卷指定漫画导致无法复习其他科目，即1。" },
        { id: 29, section: "問題5 中文読解 (1)", text: "「私」は今、どんな気持ちになっているか。", options: ["しばらくは、休みの日だけに漫画を読もう。", "しばらくは、好きな漫画しか読みたくない。", "しばらくは、我慢して漫画を読もう。", "しばらくは、漫画は読みたくない。"], correct: 4, analysis: "文末「今はしばらく漫画はお休みにしたい気分です」表示暂时不想再看任何漫画了。" },

        { id: 30, section: "問題5 中文読解 (2)", passageTitle: "港の「朝市」", passage: "A町は景色の美しい海沿いの町で、毎週日曜の朝に港で開かれる「朝市」も人気がある。朝市は、A町にある店が、魚や肉、野菜、パン、ケーキなどを売る市場で、近くの市や町からも客が大勢やってくる。<br>朝市を始めたのは、A町に昔からある店の主人たちである。約30年前、大きなスーパーマーケットができた。多くの人がスーパーを利用するようになってしまったため、店の主人たちは、自分たちの店の商品の良さをもっと知ってもらおうと、朝市を始めたのだ。<br>朝市では、人気がある商品はすぐ売り切れてしまう。そんなに人気があるなら、たくさん売ればいいのだが、それはしないそうだ。この朝市の目的は、朝市でお金を稼ぐことではなく、まず朝市で自分たちの店について知ってもらって、ふだんA町の店で買い物をする客を増やすことだからだ。そのため、朝市に商品が出せる人は ( 32 ) だけ、ということになっている。", text: "A町にある店の主人たちは、何のために朝市を始めたのか。", options: ["町の中に、安く買い物ができるところを増やすため", "町の中に、近くの市や町から来る客が楽しめる場所を作るため", "自分たちの町の景色の美しさをもっと宣伝するため", "自分たちの店の商品の良さをもっと知ってもらうため"], correct: 4, analysis: "根据第2段「自分たちの店の商品の良さをもっと知ってもらおうと、朝市を始めたのだ」。" },
        { id: 31, section: "問題5 中文読解 (2)", text: "それとあるが、何か。", options: ["朝市で人気がある商品を、店で売るより高く売ること", "朝市で人気がある商品を、朝市でもっと売ること", "朝市でしか買えない商品の種類を増やすこと", "朝市でしか買えない商品を平日に店でも売ること"], correct: 2, analysis: "前句说「人気がある商品はすぐ売り切れてしまう。そんなに人気があるなら、たくさん売ればいいのだが、それはしない」，因此それ指“在早市上大量多卖热门商品”。" },
        { id: 32, section: "問題5 中文読解 (2)", text: "( 32 ) に入れるのに最もよいものはどれか。", options: ["A町に店がある人", "A町以外の市や町に店がある人", "A町で店を開きたいと思っている人", "A町の店でふだんから買い物をしている人"], correct: 1, analysis: "早市目的是让大家平时来本镇小店消费，所以能摆摊的必须是“在A镇有店铺的店家”。" },

        { id: 33, section: "問題6 長文読解", passageTitle: "オートバイの店「ガロン」", passage: "先月、新しいオートバイを買った。オートバイには長い間乗っていなかったが、久しぶりにまた乗りたくなったのだ。前に乗っていたのは大学生のころで、もう20年も前だ。卒業後はずっと仕事や子供の世話で忙しかったが、最近、少し自由に使える時間が増えた。妻に相談したら、「いいんじゃない?」と賛成してくれた。<br>オートバイを買った店は、「ガロン」という店だ。私には、どうしてもこの店で買いたい理由があったのだ。<br>20年前の春、私は、父にもらったオートバイで東京から京都まで旅行をしていた。安い旅館に泊まりながら、何日もかけて進む旅だった。<br>3日目の朝、道を走っているとき、オートバイの前の方で何かが折れる音がした。見ると、オートバイの部品が壊れていた。ハンドルが少しぐらぐらしたが、オートバイは一応動いた。<br>しばらく進むと、オートバイの店があったので、修理を頼んでみた。しかし、難しい修理だからできない、と断られてしまった。次の店でも同じだった。そして、3軒目の店が「ガロン」だった。「ガロン」の店員も「これは難しいね。」と言った。でも、「困っているんでしょう? やってみるよ。」と言って、修理を始めてくれた。そして、2時間かけて直してくれたのだ。店員は「いつかこの店でオートバイを買ってね。」と言って笑った。本当に困っていた私は、何度もお礼を言いながら、必ずそうしようと決めた。<br>今の「ガロン」には、もうあの店員はいなかった。会えなかったのは残念だったが、それでも私は満足している。", text: "「私」がオートバイに長い間乗っていなかったのは、どうしてか。", options: ["買いたいと思うオートバイがなかったから", "仕事や子供の世話で忙しかったから", "「私」のオートバイを妻が使っていたから", "家にあるオートバイが壊れていたから"], correct: 2, analysis: "第一段明确写道「卒業後はずっと仕事や子供の世話で忙しかったが」。" },
        { id: 34, section: "問題6 長文読解", text: "オートバイの部品が壊れていたとあるが、壊れたのはいつか。", options: ["先月、新しいオートバイを買ってから3日目の朝", "先月、オートバイ旅行を始めてから3日目の朝", "20年前、新しいオートバイを買ってから3日目の朝", "20年前、オートバイ旅行を始めてから3日目の朝"], correct: 4, analysis: "对应第3、4段「20年前の春…旅行をしていた。3日目の朝…壊れていた」。" },
        { id: 35, section: "問題6 長文読解", text: "「私」はどうして何度もお礼を言ったのか。", options: ["店にあった新しいオートバイを安く売ってくれたから", "オートバイを修理してくれそうな店を教えてくれたから", "壊れて動かなくなりそうなオートバイを買ってくれたから", "ほかの店で修理を断られたオートバイを直してくれたから"], correct: 4, analysis: "前两家店都以太难为由拒绝修理，只有加仑店的店员帮忙修好，因此连连道谢。" },
        { id: 36, section: "問題6 長文読解", text: "満足しているとあるが、なぜか。", options: ["もう一度、オートバイに乗ることができたから", "「ガロン」でオートバイを買うことができたから", "壊れてしまったオートバイを修理してもらうことができたから", "オートバイの修理をしてくれた店員に、お礼を伝えることができたから"], correct: 2, analysis: "当年许下承诺“一定要来店里买摩托车”，20年后终于在“加仑”店购买实现了心愿。" },

        { id: 37, section: "問題7 情報検索", passageTitle: "朝山スキー場 初級スキー教室のご案内", passage: "期間: 12月24日~3月31日<br><strong>【コースと料金】</strong><br><strong>&lt;普通コース (2時間)&gt;</strong><br>大人一人: 4,000円 / 子ども (小学生) 一人: 4,500円<br>※午前 (10時~12時) と午後 (2時~4時) のどちらか。※朝山ホテル泊は500円引。<br><strong>&lt;特別コース (2時間または4時間)&gt;</strong><br>4~6名のグループ申込。2時間: 22,000円 / 4時間: 39,000円<br>※グループ内に朝山ホテル泊がいれば2,000円引。<br><strong>【申し込みと料金の支払い】</strong><br>・普通コース: 午前に受ける場合は当日午前9:30まで、午後の場合は当日午後1:30までに、窓口 (朝山ホテル1階) で申し込む。<br>・特別コース: 午前に開始は前日午後4時まで、午後は当日午前9時までに、電話か窓口で申し込む。", text: "スミスさんは、2月2日の午後に普通コースを受けたいと思っている。スミスさんは、どのように申し込みをしなければならないか。", options: ["2月2日の午前9時までに、電話か窓口で申し込む。", "2月2日の午前9時30分までに、窓口で申し込む。", "2月2日の午後1時30分までに、窓口で申し込む。", "2月2日の午後1時30分までに、電話か窓口で申し込む。"], correct: 3, analysis: "规定「午後に受ける場合は当日の午後1時30分までに、スキー教室の窓口で申し込んでください」。" },
        { id: 38, section: "問題7 情報検索", text: "グエンさんは、友達4人と特別コースを受けたいと思っている。グエンさんたちは、朝山ホテルに泊まっている。午後2時から4時まで特別コースを受ける場合、グエンさんたちはいくら支払わなければならないか。", options: ["22,000円を支払う。", "22,000円から2,000円を引いたものを支払う。", "39,000円を支払う。", "39,000円から2,000円を引いたものを支払う。"], correct: 2, analysis: "总共5人符合4~6人组团要求；时长2小时原价22,000円；全员住朝山酒店可享受团体减免2,000円，即支付22,000円减2,000円（20,000円）。" }

      currentCategory = catKey;
      ['vocab', 'grammar', 'listening'].forEach(key => {
        const tab = document.getElementById(`tab-${key}`);
        if (key === catKey) {
          tab.className = "py-2.5 px-4 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 transition flex items-center";
        } else {
          tab.className = "py-2.5 px-4 font-medium text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition flex items-center";
        }
      });

      const audioDock = document.getElementById('audioPlayerDock');
      if (catKey === 'listening') {
        audioDock.classList.remove('hidden');
      } else {
        audioDock.classList.add('hidden');
      }

      renderQuestions();
      updatePaletteGrid();
    }

    function ensureAudioSource() {
      const audio = document.getElementById('examAudioPlayer');
      if (!audio) return;
      if (!audio.src || audio.src === window.location.href) {
        const source = audio.querySelector('source');
        if (source && source.src) audio.src = source.src;
      }
      audio.load();
    }

    function seekAudio(seconds) {
      const audio = document.getElementById('examAudioPlayer');
      if (audio) {
        audio.currentTime = seconds;
        audio.play().catch(e => console.log("Audio play request:", e));
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = "";

      if (currentCategory === 'listening') {
        renderListeningPdfMode(container);
        return;
      }

      const questions = EXAM_DATA[currentCategory];
      let currentSectionHeader = "";

      questions.forEach((q, idx) => {
        if (q.section !== currentSectionHeader) {
          currentSectionHeader = q.section;
          const secHeaderEl = document.createElement('div');
          secHeaderEl.className = "pt-2 pb-1 border-b border-slate-200 text-xs font-bold uppercase tracking-wider text-indigo-700 flex items-center";
          secHeaderEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-indigo-600 mr-2"></span>${q.section}`;
          container.appendChild(secHeaderEl);
        }

        if (q.passage) {
          const passageBox = document.createElement('div');
          passageBox.className = "bg-amber-50/50 border border-amber-200/70 rounded-xl p-5 mb-3 text-slate-800 shadow-sm";
          let titleHtml = q.passageTitle ? `<h4 class="font-bold text-slate-900 mb-2 border-b border-amber-200 pb-1.5 flex items-center">${q.passageTitle}</h4>` : '';
          passageBox.innerHTML = `${titleHtml}<div class="passage-content leading-relaxed text-sm text-slate-700 font-normal space-y-2">${q.passage}</div>`;
          container.appendChild(passageBox);
        }

        const qCard = document.createElement('div');
        qCard.id = `q-${currentCategory}-${q.id}`;
        qCard.className = "bg-white rounded-xl border border-slate-200 p-5 shadow-sm transition hover:border-indigo-200";
        const selectedVal = userAnswers[currentCategory][q.id];
        let audioPlayBtnHtml = "";
        if (q.audioSeek !== undefined) {
          audioPlayBtnHtml = `<button onclick="seekAudio(${q.audioSeek})" class="inline-flex items-center text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-md border border-emerald-200 transition">听此题录音</button>`;
        }
        qCard.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-3">
            <div class="flex items-center space-x-2"><span class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-700 font-bold text-xs flex items-center justify-center border border-indigo-100">${q.id}</span><span class="text-xs text-slate-400 font-medium">第 ${q.id} 番</span></div>
            ${audioPlayBtnHtml}
          </div>
          <div class="text-slate-800 text-sm sm:text-base font-medium mb-4 leading-relaxed">${q.text}</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${q.options.map((opt, optIdx) => {
              const optionNumber = optIdx + 1;
              const isChecked = selectedVal === optionNumber;
              let btnClass = "border-slate-200 hover:bg-slate-50 text-slate-700";
              if (isChecked) btnClass = "border-indigo-600 bg-indigo-50/70 text-indigo-900 font-medium ring-1 ring-indigo-600";
              if (isSubmitted) {
                if (optionNumber === q.correct) btnClass = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold ring-1 ring-emerald-500";
                else if (isChecked && optionNumber !== q.correct) btnClass = "border-rose-400 bg-rose-50 text-rose-900 line-through ring-1 ring-rose-400";
              }
              return `<button onclick="selectOption('${currentCategory}', ${q.id}, ${optionNumber})" class="text-left py-2.5 px-3.5 rounded-lg border text-sm transition flex items-center space-x-3 ${btnClass}"><span class="w-6 h-6 rounded-full border text-xs flex items-center justify-center font-bold ${isChecked ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-500 border-slate-300'}">${optionNumber}</span><span class="flex-1">${opt}</span></button>`;
            }).join('')}
          </div>
          ${isSubmitted ? `<div class="mt-4 pt-4 border-t border-slate-100 bg-slate-50/70 rounded-lg p-3 text-xs space-y-2"><div class="flex items-center font-semibold ${selectedVal === q.correct ? 'text-emerald-700' : 'text-rose-700'}"><span class="mr-2">${selectedVal === q.correct ? '✓ 正解' : '✕ 不正解'}</span><span>标准答案: 第 ${q.correct} 项</span></div>${q.script ? `<div class="text-slate-700 bg-white p-2.5 rounded border border-slate-200 font-mono text-[11px] whitespace-pre-line leading-relaxed"><span class="font-bold text-indigo-700">【听力录音原文】</span><br>${q.script}</div>` : ''}<div class="text-slate-600 leading-relaxed"><span class="font-semibold text-slate-800">【试题考点解析】</span> ${q.analysis}</div></div>` : ''}
        `;
        container.appendChild(qCard);
      });
    }

    const LISTEN_PDF_PAGES = [{'page': 36, 'src': 'assets/images/listening/page36.jpg'}, {'page': 37, 'src': 'assets/images/listening/page37.jpg'}, {'page': 38, 'src': 'assets/images/listening/page38.jpg'}, {'page': 39, 'src': 'assets/images/listening/page39.jpg'}, {'page': 40, 'src': 'assets/images/listening/page40.jpg'}, {'page': 41, 'src': 'assets/images/listening/page41.jpg'}, {'page': 42, 'src': 'assets/images/listening/page42.jpg'}, {'page': 43, 'src': 'assets/images/listening/page43.jpg'}, {'page': 44, 'src': 'assets/images/listening/page44.jpg'}, {'page': 45, 'src': 'assets/images/listening/page45.jpg'}, {'page': 46, 'src': 'assets/images/listening/page46.jpg'}, {'page': 47, 'src': 'assets/images/listening/page47.jpg'}];
    const LISTEN_PAGE_GROUPS = {36: [1, 2], 37: [3, 4], 38: [5, 6], 39: [], 40: [7, 8], 41: [9, 10], 42: [11, 12], 43: [13, 14, 15], 44: [], 45: [16, 17], 46: [18, 19], 47: [20, 21, 22, 23, 24, 25, 26, 27, 28]};

    function renderListeningPdfMode(container) {
      const wrap = document.createElement('div');
      wrap.className = 'listen-pdf-wrap';
      wrap.innerHTML = `<div class="listen-pdf-intro"><b>🎧 聴解｜原卷模式</b><br>这里不再把听力题强行拆成文字。下面直接保留你提供的 N3 听力原卷页面；右侧统一用 <b>第74～101题</b> 标出对应作答区，并与原卷页码逐页对应。第93～101题（聴解5）按原卷仅显示1～3三个选项。</div>`;

      LISTEN_PDF_PAGES.forEach(p => {
        const locals = LISTEN_PAGE_GROUPS[p.page] || [];
        const pageBox = document.createElement('div');
        pageBox.className = 'listen-pdf-page';
        const side = locals.length ? `
          <div class="listen-pdf-side">
            <div class="listen-pdf-side-title">本页对应题目</div>
            ${locals.map(localId => listenAnswerCard(localId)).join('')}
            <div class="listen-pdf-note">题号已换算成整套工作台的连续题号。点击对应整套题号即可记录答案。第93～101题只有1～3三个选项。</div>
          </div>` : `
          <div class="listen-pdf-side"><div class="listen-pdf-side-title">原卷说明页</div><div class="listen-pdf-note">本页是听力大题说明 / 备忘区域，没有单独的作答框。</div></div>`;
        pageBox.innerHTML = `<div class="listen-pdf-paper"><img src="${p.src}" alt="N3聴解原卷第${p.page}页"></div>${side}`;
        wrap.appendChild(pageBox);
      });
      container.appendChild(wrap);
    }

    function listenAnswerCard(localId) {
      const globalId = 73 + localId;
      const selected = userAnswers.listening[localId];
      const correct = EXAM_DATA.listening.find(x => x.id === localId)?.correct;
      // 聴解5（整套第93～101题）在原卷中只有 1・2・3 三个选项；
      // 聴解1～4（第74～92题）为四选一。
      const optionCount = localId >= 20 ? 3 : 4;
      return `<div class="listen-q" style="--option-count:${optionCount}" id="listen-q-${globalId}"><div class="listen-q-head"><span class="listen-q-num">第${globalId}题</span><span class="listen-q-local">聴解 ${localId}</span></div><div class="listen-q-opts">${Array.from({length: optionCount}, (_,i)=>i+1).map(n => { let cls=''; if(selected===n) cls='selected'; if(isSubmitted && n===correct) cls='correct'; else if(isSubmitted && selected===n && n!==correct) cls='wrong'; return `<button class="${cls}" onclick="selectOption('listening',${localId},${n})">${n}</button>`; }).join('')}</div>${isSubmitted ? `<div class="listen-pdf-note">${selected===correct?'✓ 正确':'✕ 错误'} · 答案 ${correct}</div>`:''}</div>`;
    }

    function selectOption(category, qId, optionNum) {
      if (isSubmitted) return; // 提交后锁定

      userAnswers[category][qId] = optionNum;
      
      // 更新渲染当前题
      renderQuestions();
      updatePaletteGrid();
      updateAnswerSummary();
    }

    function updateAnswerSummary() {
      let totalAnswered = 0;
      let totalQuestions = 0;

      ['vocab', 'grammar', 'listening'].forEach(key => {
        const count = Object.keys(userAnswers[key]).length;
        const total = EXAM_DATA[key].length;
        totalAnswered += count;
        totalQuestions += total;
        document.getElementById(`badge-${key}`).textContent = `${count}/${total}`;
      });

      document.getElementById('answeredSummary').textContent = `已做: ${totalAnswered} / ${totalQuestions}`;
    }

    function updatePaletteGrid() {
      const grid = document.getElementById('questionGrid');
      grid.innerHTML = "";

      const questions = EXAM_DATA[currentCategory];

      questions.forEach(q => {
        const ans = userAnswers[currentCategory][q.id];
        const btn = document.createElement('button');
        // 听力右侧答题卡统一显示整套试卷的连续题号 74～101，
        // 与页面左侧“第74题～第101题”完全一致；同时保留本题在听力中的序号作为 title。
        const displayId = currentCategory === 'listening' ? 73 + q.id : q.id;
        btn.textContent = displayId;
        btn.title = currentCategory === 'listening' ? `第${displayId}题｜聴解第${q.id}题` : `第${displayId}题`;
        
        let stateClass = "bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200";

        if (ans !== undefined) {
          stateClass = "bg-indigo-600 text-white font-bold border border-indigo-600 shadow-sm shadow-indigo-200";
        }

        if (isSubmitted) {
          if (ans === q.correct) {
            stateClass = "bg-emerald-500 text-white font-bold border border-emerald-600";
          } else {
            stateClass = "bg-rose-500 text-white font-bold border border-rose-600";
          }
        }

        btn.className = `w-8 h-8 rounded-lg text-xs flex items-center justify-center transition font-mono ${stateClass}`;
        btn.onclick = () => {
          const targetEl = document.getElementById(`q-${currentCategory}-${q.id}`);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        };

        grid.appendChild(btn);
      });
    }

    function submitExam() {
      isSubmitted = true;
      if (timerInterval) clearInterval(timerInterval);

      // 计算3个板块得分（满分180，各60点）
      let vocabCorrect = 0;
      EXAM_DATA.vocab.forEach(q => {
        if (userAnswers.vocab[q.id] === q.correct) vocabCorrect++;
      });
      const vocabScore = Math.round((vocabCorrect / EXAM_DATA.vocab.length) * 60);

      let grammarCorrect = 0;
      EXAM_DATA.grammar.forEach(q => {
        if (userAnswers.grammar[q.id] === q.correct) grammarCorrect++;
      });
      const grammarScore = Math.round((grammarCorrect / EXAM_DATA.grammar.length) * 60);

      let listeningCorrect = 0;
      EXAM_DATA.listening.forEach(q => {
        if (userAnswers.listening[q.id] === q.correct) listeningCorrect++;
      });
      const listeningScore = Math.round((listeningCorrect / EXAM_DATA.listening.length) * 60);

      const totalScore = vocabScore + grammarScore + listeningScore;

      // JLPT N3 合格标准：总分 >= 95，且每单项得分 >= 19 分
      const isPassed = (totalScore >= 95) && (vocabScore >= 19) && (grammarScore >= 19) && (listeningScore >= 19);

      // 展现得分卡
      const resultCard = document.getElementById('resultCard');
      resultCard.classList.remove('hidden');
// ====== 成绩自动同步到 Supabase ======
      if (window.supabaseClient) {
        supabaseClient
          .from('jlpt_n3_submissions')
          .insert([
            {
              total_score: totalScore,
              score_vocab: vocabScore,
              score_grammar: grammarScore,
              score_listening: listeningScore,
              passed: isPassed,
              time_spent_seconds: 0,
              user_answers: userAnswers
            }
          ])
          .then(({ error }) => {
            if (error) {
              console.error("Supabase 同步失败:", error.message);
            } else {
              console.log("✅ 成绩已成功存入 Supabase 云端数据库！");
            }
          });
      }

      document.getElementById('finalScore').textContent = totalScore;
      document.getElementById('scoreVocab').textContent = `${vocabScore}/60 (${vocabCorrect}/${EXAM_DATA.vocab.length})`;
      document.getElementById('scoreGrammar').textContent = `${grammarScore}/60 (${grammarCorrect}/${EXAM_DATA.grammar.length})`;
      document.getElementById('scoreListening').textContent = `${listeningScore}/60 (${listeningCorrect}/${EXAM_DATA.listening.length})`;

      const tagEl = document.getElementById('passFailTag');
      if (isPassed) {
        tagEl.className = "text-sm mt-1 text-emerald-300 font-bold flex items-center";
        tagEl.innerHTML = `🎉 恭喜合格！达到N3认定基准 (合格线: 95点，各单项均超过19分基准线)`;
      } else {
        tagEl.className = "text-sm mt-1 text-rose-300 font-bold flex items-center";
        tagEl.innerHTML = `⚠️ 未达合格线 (N3基准线: 总分≥95点，且三单项各自均须≥19点)`;
      }

      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').classList.add('opacity-50', 'cursor-not-allowed');

      renderQuestions();
      updatePaletteGrid();
      
      // 页面平滑滚动到结果卡
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetAnswers() {
      if (!window.confirm("确定要清空所有答案并重新开始模考吗？")) return;
      userAnswers.vocab = {};
      userAnswers.grammar = {};
      userAnswers.listening = {};
      isSubmitted = false;
      timerSeconds = 140 * 60;
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').classList.remove('opacity-50', 'cursor-not-allowed');
      startTimer();
      renderQuestions();
      updatePaletteGrid();
      updateAnswerSummary();
    }
  </script>
</body>
</html>
